# Authoritative reference: which skills each agent must have.
# Important to state that this file also conveys an intent of capabilities that each agent should have.
#
# Sources:
#   - bundled skills: Hermes upstream bundle (82 skills), refreshed by `hermes update`
#     (tracked via `hermes skills opt-in --sync`; visibility controlled by skills.disabled)
#   - custom skills: this repo: ./skills/ — source of truth
#   - curator-generated skills: environment-managed (Hermes curator), not listed here
# Curator generated skills won't appear here until they are polished and approved as official

version: 1
updated: 2026-08-18

mimir-skills:
  bundled:
    - spike
    - codex
    - hermes-agent
    - excalidraw
    - gif-search
    - obsidian
    - youtube-content
    - session-librarian
    - ocr-and-documents
    - sketch
    - llm-wiki
  custom:
    - teach                 
    - vocabulary    

hermes-skills:   # deployed as the DEFAULT profile (display name `hermes`; "hermes" is a reserved profile name)
  bundled:
    - spike
    - codex                 # delegate coding to Codex CLI
    - hermes-agent          # operating manual for Hermes itself
    - computer-use          # desktop automation
    - excalidraw            # diagrams
    - gif-search            # gif lookup
    - obsidian              # vault notes (Zettelkasten)
    - youtube-content       # video transcripts
    - sdlc-review           # kanban review gate — official-optional: backfill via `hermes skills repair-official`
    - merge-reconciler      # arbitration for parallel agent work
    - session-librarian     # session library management
    - xlsx                  # Excel workbooks
    - pdf                   # PDF create/read/merge
    - ocr-and-documents     # text extraction from scans
    - nano-pdf              # PDF text editing
    - sketch                # throwaway HTML mockups
    - humanizer             # de-AI writing edits


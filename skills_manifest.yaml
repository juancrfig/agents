# Authoritative reference: which bundled Hermes skills each agent must have.
#
# Sources:
#   - bundled skills: Hermes upstream bundle (82 skills), refreshed by `hermes update`
#     (tracked via `hermes skills opt-in --sync`; visibility controlled by skills.disabled)
#   - custom skills: this repo: ./skills/ — source of truth
#   - curator-generated skills: environment-managed (Hermes curator), not listed here
#

version: 1
updated: 2026-08-18

# The software-development set — builders only. Installed into each builder's depot.
software-development-skills: &dev-skills
  - test-driven-development
  - systematic-debugging
  - python-debugpy
  - node-inspect-debugger
  - dogfood
  - simplify-code
  - spike
  - plan
  - requesting-code-review
  - hermes-agent-skill-authoring
  - inspecting-hermes-desktop-dom

# The visual/media production set — the Graphic Designer agent only.
creative-design-skills: &design-skills
  - claude-design           # one-off HTML artifacts (landing pages, decks, prototypes)
  - popular-web-designs     # 54 real design systems (Stripe, Linear, Vercel...) as reference
  - design-md               # DESIGN.md token spec authoring/validation (WCAG)
  - baoyu-infographic       # infographics: 21 layouts x 21 styles
  - p5js                    # generative art, interactive canvas, data viz
  - manim-video             # 3Blue1Brown-style animated explainers (algorithm walkthroughs)
  # comfyui (diffusion image/video/audio) — PHASE 2: heavy setup (local GPU or cloud,
  # 4-12 GB models). Deferred until a concrete video need exists.

agents:
  router:
    skills:
      bundled:
        - codex                 # delegate coding to Codex CLI
        - hermes-agent          # operating manual for Hermes itself
        - computer-use          # desktop automation
        - excalidraw            # diagrams
        - gif-search            # gif lookup
        - obsidian              # vault notes (Zettelkasten)
        - youtube-content       # video transcripts
        - sdlc-review           # kanban review gate
        - merge-reconciler      # arbitration for parallel agent work
        - session-librarian     # session library management
        - xlsx                  # Excel workbooks
        - pdf                   # PDF create/read/merge
        - ocr-and-documents     # text extraction from scans
        - nano-pdf              # PDF text editing
        - sketch                # throwaway HTML mockups
        - humanizer             # de-AI writing edits 
  artist:
    skills: 
      - *design-skills
  builder:
    skills: 
      - *dev-skills
  teacher:
    skills:
      - teach                 
      - vocabulary

database:
  journal_mode: wal

compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  threshold_tokens: 150000
  target_ratio: 0.2
  protect_last_n: 10
  min_tail_user_messages: 1
  max_attempts: 2
  proactive_prune_tokens: 48000
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  micro_compact: false
  protect_first_n: 3
  abort_on_summary_failure: true
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  idle_compact_after_seconds: 0

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

display:
  show_reasoning: false
  interim_assistant_messages: false

approvals:
  mode: smart
  deny:
    - "git push --force*"
    - "git push -f*"
    - "git push * --force*"
    - "git push * -f*"
    - "*curl*|*sh*"
    - "*curl*|*bash*"
    - "*wget*|*sh*"
    - "*wget*|*bash*"
    - "rm *~/.hermes*"
    - "rm */.hermes*"
    - "*[;&|] rm *~/.hermes*"
    - "*[;&|] rm */.hermes*"
    - "git push *--mirror*"
    - "git push *--prune*"
  destructive_slash_confirm: false

command_allowlist: []

auxiliary:
  skills_hub:
    provider: nous
    model: deepseek/deepseek-v4-flash
    reasoning_effort: low
    timeout: 30
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

  kanban_decomposer:
    provider: nous
    model: deepseek/deepseek-v4-flash
    reasoning_effort: low
    timeout: 120
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

  profile_describer:
    provider: nous
    model: deepseek/deepseek-v4-flash
    reasoning_effort: none
    timeout: 30
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

  background_review:
    provider: nous
    model: deepseek/deepseek-v4-flash
    reasoning_effort: medium
    timeout: 120
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna
        
  compression:
    provider: nous
    model: deepseek/deepseek-v4-flash
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

  web_extract:
    provider: nous
    model: deepseek/deepseek-v4-flash
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

  vision:
    provider: openrouter
    model: google/gemini-2.5-flash

  approval:
    provider: nous
    model: deepseek/deepseek-v4-flash
    timeout: 30
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

  curator:
    provider: nous
    model: deepseek/deepseek-v4-flash
    timeout: 600
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

  mcp:
    provider: nous
    model: deepseek/deepseek-v4-flash
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

  tts_audio_tags:
    provider: nous
    model: deepseek/deepseek-v4-flash
    fallback_chain:
      - provider: nous
        model: openai/gpt-5.6-luna

security:
  tirith_fail_open: false

delegation:
  provider: nous
  model: deepseek/deepseek-v4-flash
  max_iterations: 100

fallback_providers:
  - provider: nous
    model: openai/gpt-5.6-luna

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true

skills:
  write_approval: false

prompt_caching:
  cache_ttl: 1h

telemetry:
  shared_metrics:
    enabled: true

smart_model_routing:
  enabled: false

session_reset:
  mode: none

curator:
  enabled: true
  interval_hours: 168
  min_idle_hours: 2
  stale_after_days: 30
  archive_after_days: 90
  consolidate: true
  prune_builtins: true

timezone: America/Bogota
